<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} – {{ .Site.Title }}{{ end }}</title>
  <link rel="stylesheet" href="{{ "css/style.css" | relURL }}">
</head>
<body>
  <header class="site-header">
    <a class="site-title" href="{{ .Site.Home.RelPermalink }}">{{ .Site.Title }}</a>
    <nav>
      <a href="{{ .Site.Home.RelPermalink }}">Werke</a>
      <a href="{{ "ueber/" | relURL }}">Über diese Datenbank</a>
      <a href="{{ "werke.ttl" | relURL }}">RDF-Export (Turtle)</a>
    </nav>
  </header>
  <main>
    {{ block "main" . }}{{ end }}
  </main>
  <footer class="site-footer">
    <p>Werkportal Orlando di Lasso · Datengrundlage: TeX-Quelldatei LVTEX1.TEX ·
       <a href="{{ "ueber/" | relURL }}">Hinweise zur Datengrundlage</a></p>
  </footer>
</body>
</html>
